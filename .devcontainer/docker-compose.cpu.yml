services:
  llm_dev:
    build:
      context: .
      dockerfile: "Dockerfile.vllm"
      args:
        BASE_IMAGE: "public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.2"
    environment:
      - HF_HOME=/home/user/.cache/huggingface
      - UV_LINK_MODE=copy
      - BACKEND=cpu
    volumes:
      - ../:/workspace
      - ${HOME}/.cache/huggingface:/home/user/.cache/huggingface
      - ${HOME}/.cache/uv:/home/user/.cache/uv
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: 8g
    network_mode: host
    working_dir: /workspace
    entrypoint: ["/bin/sh"]
    command: ["-c", "while sleep 1000; do :; done"]