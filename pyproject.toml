[project]
name = "werewolf-llm"
version = "0.1.0"
description = "A project to train an LLM to play One Night Ultimate Werewolf."
authors = [{ name = "GitHub Copilot" }]
requires-python = ">=3.9"
dependencies = [
    "llama-cpp-python>=0.3.14",
    "pydantic>=2.11.7",
]

[project.scripts]
generate-sft-data = "werewolf_llm.generate_sft_data:main_sync"
train = "werewolf_llm.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_llm"]

[dependency-groups]
dev = []
training = [
    "accelerate>=1.9.0",
    "bitsandbytes>=0.46.1",
    "datasets>=4.0.0",
    "evaluate>=0.4.5",
    "numpy>=2.0.2",
    "pandas>=2.3.1",
    "peft>=0.16.0",
    "scikit-learn>=1.6.1",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "transformers>=4.53.2",
]
